name: Harbor
options:
  bundleIdPrefix: app.harbor
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit.git
    from: 0.6.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Harbor:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: TOMLKit
        product: TOMLKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleName: Harbor
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.Harbor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

  HarborTests:
    type: bundle.unit-test
    platform: macOS
    # Unhosted: compiles Models + Services into the test bundle so tests run
    # without launching the app (CI-friendly).
    sources:
      - path: Tests
      - path: App/Models
      - path: App/Services
    dependencies:
      - package: TOMLKit
        product: TOMLKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.HarborTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HarborTests
    run:
      config: Debug

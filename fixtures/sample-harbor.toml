name = "example"

[[process]]
name = "api"
command = "uv run uvicorn app.main:app --reload"
cwd = "backend"
port = 8000
ready_url = "http://127.0.0.1:8000/health"

[[process]]
name = "web"
command = "npm run dev"
cwd = "frontend"
port = 5173

# Ports the project relies on without a single owning process — used for
# cross-project overlap detection and the ports overview.
[[port_claim]]
port = 5432
note = "postgres"
process = "api"

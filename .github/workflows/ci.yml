name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run HarborCore tests (SwiftPM)
        working-directory: Core
        run: swift test

      - name: Build app (compile gate)
        run: |
          set -o pipefail
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

  release:
    name: Release
    # Only a version tag (v*) gets a release. The tag must point at a commit
    # on main and match MARKETING_VERSION — checked below.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          echo "compare main...$GITHUB_SHA -> $STATUS"
          if [[ "$STATUS" != "behind" && "$STATUS" != "identical" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not point at main — not releasing."
            exit 1
          fi

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build build

      - name: Verify version matches tag, then package
        run: |
          APP="build/Build/Products/Release/Harbor.app"
          EXPECTED="${GITHUB_REF_NAME#v}"
          VERSION=$(awk '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml — bump project.yml and re-tag."
            exit 1
          fi
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [[ "$APP_VERSION" != "$VERSION" && "$APP_VERSION" != '$(MARKETING_VERSION)' ]]; then
            echo "::error::Built app version $APP_VERSION does not match MARKETING_VERSION $VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Harbor-$VERSION.zip"
          STAGING="build/release-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/Harbor.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Harbor $VERSION" -srcfolder "$STAGING" -ov -format UDZO "Harbor-$VERSION.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Harbor-${VERSION}.zip" "Harbor-${VERSION}.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Harbor $GITHUB_REF_NAME" \
            --generate-notes

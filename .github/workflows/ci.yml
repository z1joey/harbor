name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # Pinned image (not macos-latest): the default Xcode moves with the
    # runner image. macos-15's Xcode 16+ is required — xcodegen 2.46 writes
    # objectVersion 77 project files, which Xcode 15.4 (macos-14's default)
    # cannot read.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: Core/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Core/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The generated project is committed — fail when it drifted from
      # project.yml (a contributor forgot to regenerate).
      - name: Check generated project is in sync
        run: git diff --exit-code Harbor.xcodeproj

      - name: Run HarborCore tests (SwiftPM)
        working-directory: Core
        run: swift test

      - name: Build app (compile gate)
        run: |
          set -o pipefail
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

  release:
    name: Release
    # Only a version tag (v*) gets a release. The tag must point at a commit
    # on main and match MARKETING_VERSION — checked below.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          echo "compare main...$GITHUB_SHA -> $STATUS"
          if [[ "$STATUS" != "behind" && "$STATUS" != "identical" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not point at main — not releasing."
            exit 1
          fi

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build build

      - name: Verify version matches tag, then package
        run: |
          APP="build/Build/Products/Release/Harbor.app"
          EXPECTED="${GITHUB_REF_NAME#v}"
          VERSION=$(awk '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml — bump project.yml and re-tag."
            exit 1
          fi
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          # An unexpanded "$(MARKETING_VERSION)" placeholder means the build
          # config silently lost the version — that is exactly what this
          # check exists to catch, so it is a hard failure, not an escape.
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "::error::Built app version $APP_VERSION does not match MARKETING_VERSION $VERSION."
            exit 1
          fi
          CORE_VERSION=$(sed -n 's/^public let harborVersion = "\(.*\)"/\1/p' Core/Sources/HarborCore/HarborVersion.swift)
          if [[ "$CORE_VERSION" != "$EXPECTED" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match harborVersion $CORE_VERSION in Core/Sources/HarborCore/HarborVersion.swift — bump it and re-tag."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Harbor-$VERSION.zip"
          STAGING="build/release-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/Harbor.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Harbor $VERSION" -srcfolder "$STAGING" -ov -format UDZO "Harbor-$VERSION.dmg"

      - name: Build harbor-tui (universal binary)
        working-directory: Core
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN_DIR=$(swift build --show-bin-path -c release --arch arm64 --arch x86_64)
          echo "TUI_BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"

      - name: Package harbor-tui
        run: |
          tar -czf "harbor-tui-$VERSION.macos-universal.tar.gz" \
            -C "$TUI_BIN_DIR" harbor-tui

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Harbor-${VERSION}.zip" "Harbor-${VERSION}.dmg" \
            "harbor-tui-${VERSION}.macos-universal.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Harbor $GITHUB_REF_NAME" \
            --generate-notes
